name: Validate Shots

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run validator against examples
        run: |
          echo "=== shots-example.json ==="
          node validator/check-shots.js examples/shots-example.json --project examples/project.json
          echo ""
          echo "=== context-table.json ==="
          node validator/check-shots.js examples/context-table.json --project examples/project.json

      - name: Run validator with JSON output
        run: |
          echo "=== JSON output test ==="
          node validator/check-shots.js examples/shots-example.json --project examples/project.json --json | python3 -m json.tool
