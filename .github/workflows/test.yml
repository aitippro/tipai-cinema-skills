name: Validate Shots

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test standard example (shots-example.json)
        run: node validator/check-shots.js examples/shots-example.json --project examples/project.json

      - name: Test context-table example
        run: node validator/check-shots.js examples/context-table.json --project examples/project.json

      - name: Test extreme-shot example
        run: node validator/check-shots.js examples/extreme-shot.json --project examples/project.json

      - name: JSON output test (extreme-shot)
        run: node validator/check-shots.js examples/extreme-shot.json --project examples/project.json --json

      - name: Verbose output test
        run: node validator/check-shots.js examples/extreme-shot.json --project examples/project.json --verbose
